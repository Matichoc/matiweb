<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Productos Destacados - Matichoc</title>
<meta property="og:type" content="website">
<meta property="og:title" content="Productos Destacados - Matichoc">
<meta property="og:description" content="Alfajores, cuchuflí, bombones, tabletas y más chocolates artesanales de Matichoc.">
<meta property="og:image" content="../assets/brand/logo-horizontal.png">
<link rel="icon" type="image/x-icon" href="../assets/brand/favicon.ico">
<link rel="icon" type="image/png" sizes="512x512" href="../assets/brand/icon-512.png">
<link rel="apple-touch-icon" href="../assets/brand/apple-touch-icon.png">
<link rel="stylesheet" href="../css/styles.css" />
<style>
    .header {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 30px;
      gap: 15px;
    }
    .header img {
      height: 50px;
    }
    .section {
      background-color: #ffffff;
      border: 2px solid #FFC800;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 40px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }
    .section h3 {
      color: #D4216C;
      margin-top: 0;
    }
    .section p {
      margin: 10px 0;
      font-size: 16px;
    }
    .carousel-container {
      position: relative;
      overflow: hidden;
      width: 100%;
      margin-top: 20px;
    }
    .carousel-track {
      display: flex;
      transition: transform 0.5s ease;
    }
    .carousel-item {
      min-width: 200px;
      margin: 0 10px;
      flex-shrink: 0;
      background-color: #fff;
      border: 1px solid #D4216C;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .carousel-item img {
      width: 100%;
      height: 150px;
      object-fit: cover;
    }
    .whatsapp-btn {
      display: inline-block;
      background-color: #25D366;
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      margin-top: 10px;
    }
    .carousel-buttons {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 100%;
      display: flex;
      justify-content: space-between;
    }
    .carousel-buttons button {
      background-color: #D4216C;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 50%;
      cursor: pointer;
    }
    @media (max-width: 768px) {
      .carousel-track {
        transform: translateX(0) !important;
      }
      .carousel-item {
        min-width: 100%;
      }
    }
  </style>
</head>
<body>
<header id="header"></header>

<main>
  <div class="header">
    <img src="../assets/brand/icon-512.png" alt="Logo Matichoc">
    <h2>Productos Frecuentes</h2>
  </div>

  <div id="carruseles-container"></div>

  <script src="../js/catalogo.js"></script>
  <script>
    // Agrupa el catálogo compartido (js/catalogo.js) por categoría para mostrarlo aquí.
    const categorias = [];
    CATALOGO.forEach(item => {
      let cat = categorias.find(c => c.nombre === item.categoria);
      if (!cat) {
        cat = { nombre: item.categoria, items: [], imagenes: [] };
        categorias.push(cat);
      }
      cat.items.push(item);
      if (!cat.imagenes.includes(item.img)) cat.imagenes.push(item.img);
    });

    const contenedor = document.getElementById('carruseles-container');

    categorias.forEach(cat => {
      const id = cat.nombre.toLowerCase().replace(/[^a-z0-9]+/g, '-');
      const mensaje = encodeURIComponent(`Hola, me interesa consultar por: ${cat.nombre}`);
      const section = document.createElement('div');
      section.className = 'section';
      section.innerHTML = `
        <h3>${cat.nombre}</h3>
        <ul>
          ${cat.items.map(p => `
            <li><strong>${p.nombre}</strong>${p.descripcion ? ' — ' + p.descripcion : ''} — $${p.precio.toLocaleString('es-CL')}</li>
          `).join('')}
        </ul>
        <a class="whatsapp-btn" href="https://wa.me/56975645591?text=${mensaje}" target="_blank">📲 Consulta aquí</a>
        <div class="carousel-container" id="carousel-${id}">
          <div class="carousel-track">
            ${cat.imagenes.map(url => `
              <div class="carousel-item">
                <img src="${url}">
              </div>`).join('')}
          </div>
          <div class="carousel-buttons">
            <button onclick="moveCarousel('carousel-${id}', -1)">❮</button>
            <button onclick="moveCarousel('carousel-${id}', 1)">❯</button>
          </div>
        </div>
      `;
      contenedor.appendChild(section);
    });

    // Producto de temporada / personalizado: sin precio fijo, solo consulta.
    const consultaMensaje = encodeURIComponent(`Hola, me interesa consultar por: ${CATALOGO_CONSULTAR.categoria}`);
    const seccionConsulta = document.createElement('div');
    seccionConsulta.className = 'section';
    seccionConsulta.innerHTML = `
      <h3>${CATALOGO_CONSULTAR.categoria}</h3>
      <p>${CATALOGO_CONSULTAR.descripcion}</p>
      <a class="whatsapp-btn" href="https://wa.me/56975645591?text=${consultaMensaje}" target="_blank">📲 Consulta aquí</a>
    `;
    contenedor.appendChild(seccionConsulta);

    const carousels = {};
    function moveCarousel(id, direction) {
      if (!(id in carousels)) carousels[id] = 0;
      const container = document.getElementById(id);
      const track = container.querySelector('.carousel-track');
      const items = container.querySelectorAll('.carousel-item');
      const itemWidth = items[0].offsetWidth + 20;
      const visibleItems = Math.floor(container.offsetWidth / itemWidth);
      const maxIndex = items.length - visibleItems;
      carousels[id] += direction;
      if (carousels[id] < 0) carousels[id] = 0;
      if (carousels[id] > maxIndex) carousels[id] = maxIndex;
      track.style.transform = `translateX(-${carousels[id] * itemWidth}px)`;
    }
  </script>
</main>

<footer id="footer"></footer>

<a href="https://wa.me/56975645591" target="_blank" class="whatsapp-float" aria-label="Escríbenos por WhatsApp">

</a>

<script src="../js/base.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    loadComponent('header', '../components/header.html', { base: '../' });
    loadComponent('footer', '../components/footer.html', { base: '../' });
  });
</script>
</body>
</html>
