<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Productos Destacados - Matichoc</title>
<link rel="stylesheet" href="../css/styles.css" />
<style>
    .header {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 30px;
      gap: 15px;
    }
    .header img {
      height: 50px;
    }
    .section {
      background-color: #ffffff;
      border: 2px solid #FFC800;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 40px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }
    .section h3 {
      color: #D4216C;
      margin-top: 0;
    }
    .section p {
      margin: 10px 0;
      font-size: 16px;
    }
    .carousel-container {
      position: relative;
      overflow: hidden;
      width: 100%;
      margin-top: 20px;
    }
    .carousel-track {
      display: flex;
      transition: transform 0.5s ease;
    }
    .carousel-item {
      min-width: 200px;
      margin: 0 10px;
      flex-shrink: 0;
      background-color: #fff;
      border: 1px solid #D4216C;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .carousel-item img {
      width: 100%;
      height: 150px;
      object-fit: cover;
    }
    .whatsapp-btn {
      display: inline-block;
      background-color: #25D366;
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      margin-top: 10px;
    }
    .carousel-buttons {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 100%;
      display: flex;
      justify-content: space-between;
    }
    .carousel-buttons button {
      background-color: #D4216C;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 50%;
      cursor: pointer;
    }
    @media (max-width: 768px) {
      .carousel-track {
        transform: translateX(0) !important;
      }
      .carousel-item {
        min-width: 100%;
      }
    }
  </style>
</head>
<body>
<header id="header"></header>

<main>
  <div class="header">
    <img src="https://i.imgur.com/So3zZ6u.png" alt="Logo Matichoc">
    <h2>Productos Frecuentes</h2>
  </div>

  <div id="carruseles-container"></div>

  <script>
    const carouseles = [
      {
        id: 'alfajores',
        titulo: 'Alfajores',
        texto: 'Alfajores deliciosos rellenos con manjar y esencias de sabores (menta, frutilla, plátano, pie de limón, frambuesa, tres leches, café moka, capuchino y muchos más), bañados en chocolate semi amargo de 52% de cacao.',
        precios: '$1.000 Tradicional o sabor<br>$1.500 Personalizado',
        imagenes: ['C01CAjn', 'WSv71hy', 'ncBRyei', 'JpG4dmt', 'jfguSAZ', '2Nz9EtP', 'kXgKT3d']
      },
      {
        id: 'cuchufli',
        titulo: 'Cuchuflí',
        texto: 'Deliciosos cuchuflí rellenos con manjar y bañados en chocolate semi amargo de 52% de cacao.',
        precios: '$1.000 Bolsa 3 cuchuflí Tradicional<br>$1.500 Bolsa 3 Personalizado<br>$14.000 Torta de cuchuflí',
        imagenes: ['KvjlYTA', '4CAvQAT', 'Mgd5CIN', '2Nxg7t5', 'lPyRjcm', 'zPEQu39', '0POqiWR']
      },
      {
        id: 'prestigios',
        titulo: 'Prestigios',
        texto: 'Deliciosas bolitas de coco y leche condensada, bañadas en chocolate semi amargo de 52% de cacao.',
        precios: '$1.000 bolsita 2 unidades',
        imagenes: ['VvGQWV1', 'o5ofqlW', 'SL8HW1X']
      },
      {
        id: 'matidubai',
        titulo: 'Matidubai',
        texto: 'Barra viral rellena de crema natural de pistachos y fideo kataifi, cubierta de chocolate de leche.',
        precios: '$12.000 versión grande<br>$1.500 Mini Dubai',
        imagenes: ['FcrTH9K']
      },
      {
        id: 'bombas',
        titulo: 'Bombas de Chocolate',
        texto: 'Bombas ideales para la leche, pueden ser de Café o Milo. Incluyen marshmallow.',
        precios: '$1.500',
        imagenes: ['dkkIZCU', 'GKzR4KT', 'RMWgvz1']
      },
      {
        id: 'bombones',
        titulo: 'Bombones',
        texto: 'Encanta a los tuyos con distintos formatos de bombones.',
        precios: '$9.000 Caja corazón 15 bombones<br>$4.000 Caja corazón 7 bombones',
        imagenes: ['KBdJtkS', '2qYRxW8', 'RVKxtSj', 've2ogNX', 'uSVbja3', 'imUqF5N']
      },
      {
        id: 'barras',
        titulo: 'Barras de Chocolate',
        texto: 'Tabletas deliciosas de distintos chocolates y rellenos.',
        precios: '$1.500 Capri<br>$4.000 tabletas de colores o rellenas',
        imagenes: ['0IzB6cW', 'eO1gzDB', '5RCFRg3', '0L0iFSV', 'GboR5zb', 'HFT67A3', '0Yy84kg']
      },
      {
        id: 'cajas',
        titulo: 'Cajas Mix',
        texto: 'Sorprende y arma tu momento a tu gusto. Mezcla los productos que quieras.',
        precios: 'Consulta según tu mezcla preferida',
        imagenes: ['x7xTgWJ', 'VrVpwh8', 'avEGMQW', 'TKXUyyn', 'HPzNLRk', 'khK4UNu', 'jzRXe20']
      },
      {
        id: 'frutillas',
        titulo: 'Frutillas con Chocolate',
        texto: 'Frutillas bañadas en chocolate: brillantes o muy chocolatosas.',
        precios: 'Consulta precios según presentación',
        imagenes: ['RJWddAV', 'HwaPrtU', 'PP8M3UP', 'sUUX76m']
      },
      {
        id: 'varios',
        titulo: 'Otros Productos',
        texto: 'Sorpresas, figuras y delicias varias.',
        precios: 'Consulta aquí',
        imagenes: ['zncQbMZ', 'wDYCiyP', '6tqiYy2', 'C3omkO3', 'Us0zdUP']
      }
    ];

    const contenedor = document.getElementById('carruseles-container');

    carouseles.forEach(item => {
      const section = document.createElement('div');
      section.className = 'section';
      section.innerHTML = `
        <h3>${item.titulo}</h3>
        <p>${item.texto}</p>
        <p><strong>Precios:</strong><br>${item.precios}</p>
        <a class="whatsapp-btn" href="https://wa.me/56975645591">📲 Consulta aquí</a>
        <div class="carousel-container" id="carousel-${item.id}">
          <div class="carousel-track">
            ${item.imagenes.map(code => `
              <div class="carousel-item">
                <img src="https://i.imgur.com/${code}.jpg">
              </div>`).join('')}
          </div>
          <div class="carousel-buttons">
            <button onclick="moveCarousel('carousel-${item.id}', -1)">❮</button>
            <button onclick="moveCarousel('carousel-${item.id}', 1)">❯</button>
          </div>
        </div>
      `;
      contenedor.appendChild(section);
    });

    const carousels = {};
    function moveCarousel(id, direction) {
      if (!(id in carousels)) carousels[id] = 0;
      const container = document.getElementById(id);
      const track = container.querySelector('.carousel-track');
      const items = container.querySelectorAll('.carousel-item');
      const itemWidth = items[0].offsetWidth + 20;
      const visibleItems = Math.floor(container.offsetWidth / itemWidth);
      const maxIndex = items.length - visibleItems;
      carousels[id] += direction;
      if (carousels[id] < 0) carousels[id] = 0;
      if (carousels[id] > maxIndex) carousels[id] = maxIndex;
      track.style.transform = `translateX(-${carousels[id] * itemWidth}px)`;
    }
  </script>
</main>

<footer id="footer"></footer>

<script src="../js/base.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    loadComponent('header', '../components/header.html', { base: '../' });
    loadComponent('footer', '../components/footer.html', { base: '../' });
  });
</script>
</body>
</html>
