<section class="page-banner" aria-label="{{titulo}}">
  <div class="page-banner__contenido choco-fade-in">
    <p class="page-banner__emoji" aria-hidden="true">{{emoji}}</p>
    <h1 class="page-banner__titulo">{{titulo}}</h1>
    <p class="page-banner__sub">{{subtitulo}}</p>
  </div>

  <div class="choco-particles" aria-hidden="true">
    <span class="choco-particle" style="--x: 8%; --dur: 7s; --delay: 0s;">🍫</span>
    <span class="choco-particle" style="--x: 20%; --dur: 9s; --delay: 1.2s;">✨</span>
    <span class="choco-particle" style="--x: 78%; --dur: 8s; --delay: .6s;">🍫</span>
    <span class="choco-particle" style="--x: 90%; --dur: 10s; --delay: 2s;">✨</span>
    <span class="choco-particle" style="--x: 50%; --dur: 11s; --delay: 1.6s;">🍫</span>
  </div>
</section>
